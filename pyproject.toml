[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "C90",
    "B",
    "S",
]
ignore = [
    "S701"  # Because we don't render anything - it's only for pre-processing.
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"*test*.py" = ["S"]
