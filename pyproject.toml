[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
    ".venv",  # Venv is always excluded. Pernament resident, linting shouldn't care about it.
    # Temporarily excluded directories due to WIP on the branch that may cause errors.
    "auditable_calculations"
]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "C90",
    "B",
    "S",
    "SIM",
    "FBT",
    "C4",
    "DTZ",
    "SLF",
    "TC",
    "PTH",
    "FLY",
]
ignore = [
    "S701",  # Because we don't render anything - it's only for pre-processing.
    "SIM103",  # Sparse is better than dense, so in some scenarios it makes sense, but in others it's a PITA.
    "C408",  # Sometimes it's easier to follow and migrate to a different implementation when not using literals.
    "PTH123",  # There is no benefit of using a path instead of the open function.
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "E402",  # Because imports can include logic in the case of __init__.
    "F401"  # Because imports in __init__ are for other places to import.
]
"*test*.py" = [
    "S"  # Tests code may have looser contraints and will use asserts for example.
]

[tool.ty.src]
# Temporarily excluded directories due to WIP on the branch that may cause errors.
exclude = [
    "posts/auditable_calculations"
]

[tool.pytest.ini_options]
minversion = "8.3"
